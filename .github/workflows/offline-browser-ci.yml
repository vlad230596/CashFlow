name: Offline browser CI

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Build release app for the isolated API
        working-directory: app
        run: >-
          flutter build web --release --no-web-resources-cdn
          --dart-define=CASHFLOW_API_URL=http://127.0.0.1:18741
      - name: Install test dependencies
        working-directory: tests/browser
        run: npm ci
      - name: Install Chromium
        working-directory: tests/browser
        run: npx playwright install --with-deps chromium
      - name: Run offline contract twice without retries
        working-directory: tests/browser
        # Shared runners have no GPU and are slower than the 2-second reference
        # machine: locally 1.4-1.6 s, here about 2.1 s. Temporary owner decision.
        env:
          OFFLINE_STARTUP_BUDGET_MS: '5000'
        run: npm run test:repeat
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-browser-evidence
          path: |
            tests/browser/test-results/
            tests/browser/playwright-report/
          retention-days: 7
