name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_call:
    inputs:
      ref:
        description: Git ref to verify
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to verify
        required: false
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    uses: ./.github/workflows/backend-ci.yml
    with:
      ref: ${{ inputs.ref }}

  frontend:
    uses: ./.github/workflows/frontend-ci.yml
    with:
      ref: ${{ inputs.ref }}

  browser-extension:
    uses: ./.github/workflows/extension-ci.yml
    with:
      ref: ${{ inputs.ref }}

  integration:
    uses: ./.github/workflows/integration-ci.yml
    with:
      ref: ${{ inputs.ref }}

  required:
    name: Required checks
    if: always()
    needs: [backend, frontend, browser-extension, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every component check
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          EXTENSION_RESULT: ${{ needs.browser-extension.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          results=(
            "$BACKEND_RESULT"
            "$FRONTEND_RESULT"
            "$EXTENSION_RESULT"
            "$INTEGRATION_RESULT"
          )
          printf 'Component results: %s\n' "${results[*]}"
          for result in "${results[@]}"; do
            test "$result" = success
          done
