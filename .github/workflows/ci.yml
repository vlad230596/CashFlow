name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Git ref to verify
        required: false
        type: string

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install uv
        run: python -m pip install uv==0.12.3
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Test backend
        working-directory: backend
        run: |
          uv run ruff check .
          uv run pytest -q
          uv lock --check
          uv run alembic upgrade head --sql >/dev/null

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get
      - name: Analyze Flutter app
        working-directory: app
        run: flutter analyze
      - name: Test Flutter app
        working-directory: app
        run: flutter test
      - name: Build Flutter web frontend
        working-directory: app
        run: flutter build web --release

  browser-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/browser_extension/package-lock.json
      - name: Install extension dependencies
        working-directory: app/browser_extension
        run: npm ci
      - name: Check extension
        working-directory: app/browser_extension
        run: npm run check
