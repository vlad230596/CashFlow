name: Backend CI

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to verify
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to verify
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install uv
        run: python -m pip install uv==0.12.3
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Test backend
        working-directory: backend
        run: |
          uv run ruff check .
          uv run pytest -q
          uv lock --check
          uv run alembic upgrade head --sql >/dev/null
      - name: Build backend image
        run: docker build --pull --tag cashflow-backend:ci backend

