name: Release CashFlow

on:
  workflow_dispatch:
    inputs:
      version:
        description: New SemVer version to approve, tag, and deploy from main
        required: true
        type: string

concurrency:
  group: cashflow-production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      ref: ${{ steps.release.outputs.ref }}
      build_date: ${{ steps.release.outputs.build_date }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Validate release input
        id: release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo 'Release workflow must be started from main.' >&2
            exit 64
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be a SemVer core such as 1.0.0." >&2
            exit 64
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists." >&2
            exit 65
          fi
          sha="$(git rev-parse HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  quality:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  approve:
    needs: [prepare, quality]
    runs-on: ubuntu-latest
    environment:
      name: release-approval
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Create approved release tag
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION was created while approval was pending." >&2
            exit 65
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag --annotate "$VERSION" "$RELEASE_SHA" --message "CashFlow $VERSION"
          git push origin "refs/tags/$VERSION"

  publish:
    needs: [prepare, approve]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      backend_digest: ${{ steps.backend.outputs.digest }}
      frontend_digest: ${{ steps.frontend.outputs.digest }}
    env:
      REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ${{ github.repository_owner }}
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish backend
        id: backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ env.VERSION }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          tags: |
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/cashflow-backend:${{ env.VERSION }}
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/cashflow-backend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.created=${{ env.BUILD_DATE }}
      - name: Attest backend image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ env.IMAGE_NAMESPACE }}/cashflow-backend
          subject-digest: ${{ steps.backend.outputs.digest }}
          push-to-registry: true

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true
      - name: Build Flutter web frontend
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release --no-web-resources-cdn --build-name "$VERSION"
      - name: Build and publish frontend
        id: frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./app
          file: ./app/Dockerfile.web
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ env.VERSION }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          tags: |
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/cashflow-frontend:${{ env.VERSION }}
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/cashflow-frontend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.created=${{ env.BUILD_DATE }}
      - name: Attest frontend image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ env.IMAGE_NAMESPACE }}/cashflow-frontend
          subject-digest: ${{ steps.frontend.outputs.digest }}
          push-to-registry: true

  apk:
    needs: [prepare, approve]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      CASHFLOW_API_URL: https://cash-flow-app.duckdns.org:8443
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true
      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/android/app/release-keystore.jks
          chmod 600 app/android/app/release-keystore.jks
      - name: Build signed production APK
        working-directory: app
        env:
          CASHFLOW_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/app/android/app/release-keystore.jks
          CASHFLOW_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CASHFLOW_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CASHFLOW_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter build apk --release \
            --build-name "$VERSION" \
            --build-number "$GITHUB_RUN_NUMBER" \
            --dart-define="CASHFLOW_API_URL=$CASHFLOW_API_URL"
          mv build/app/outputs/flutter-apk/app-release.apk "../cashflow-$VERSION.apk"
          cd ..
          sha256sum "cashflow-$VERSION.apk" > "cashflow-$VERSION.apk.sha256"
      - name: Attest APK
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: cashflow-${{ env.VERSION }}.apk
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" \
              "cashflow-$VERSION.apk" \
              "cashflow-$VERSION.apk.sha256" \
              --clobber
          else
            gh release create "$VERSION" \
              "cashflow-$VERSION.apk" \
              "cashflow-$VERSION.apk.sha256" \
              --verify-tag \
              --title "CashFlow $VERSION" \
              --generate-notes
          fi

  deploy:
    needs: [prepare, publish, apk]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    permissions:
      contents: read
      packages: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cashflow-backend@${{ needs.publish.outputs.backend_digest }}
      FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cashflow-frontend@${{ needs.publish.outputs.frontend_digest }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
    steps:
      - name: Configure production SSH key
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/cashflow-production
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/cashflow-production ~/.ssh/known_hosts
      - name: Deploy immutable application images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | ssh \
            -i ~/.ssh/cashflow-production \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "sudo /usr/local/sbin/cashflow-deploy '$VERSION' '$BACKEND_IMAGE' '$FRONTEND_IMAGE' '${{ github.actor }}'"
