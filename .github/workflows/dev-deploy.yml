name: Deploy main to development

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: Main ref to verify and deploy
        required: false
        default: main
        type: string

concurrency:
  group: cashflow-development
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  manual-quality:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.ref }}

  prepare:
    if: >-
      always() &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
       (github.event_name == 'workflow_dispatch' && needs.manual-quality.result == 'success'))
    needs: [manual-quality]
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      build_date: ${{ steps.version.outputs.build_date }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}
      - name: Resolve immutable development version
        id: version
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=dev-${sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  publish-backend:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish backend
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.version }}
            BUILD_DATE=${{ needs.prepare.outputs.build_date }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/cashflow-backend:dev-main
            ghcr.io/${{ github.repository_owner }}/cashflow-backend:dev-${{ needs.prepare.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.created=${{ needs.prepare.outputs.build_date }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/cashflow-backend
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  publish-frontend:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true
      - name: Build self-contained Flutter web frontend
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release --no-web-resources-cdn \
            --build-name "${{ needs.prepare.outputs.version }}"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish frontend
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./app
          file: ./app/Dockerfile.web
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.version }}
            BUILD_DATE=${{ needs.prepare.outputs.build_date }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/cashflow-frontend:dev-main
            ghcr.io/${{ github.repository_owner }}/cashflow-frontend:dev-${{ needs.prepare.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.created=${{ needs.prepare.outputs.build_date }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/cashflow-frontend
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  deploy:
    needs: [prepare, publish-backend, publish-frontend]
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://cash-flow-app.duckdns.org:8444
    permissions:
      contents: read
      packages: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cashflow-backend@${{ needs.publish-backend.outputs.digest }}
      FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cashflow-frontend@${{ needs.publish-frontend.outputs.digest }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
    steps:
      - name: Configure development SSH key
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/cashflow-development
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/cashflow-development ~/.ssh/known_hosts
      - name: Deploy immutable images to development
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | ssh \
            -i ~/.ssh/cashflow-development \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "sudo /usr/local/sbin/cashflow-dev-deploy '$VERSION' '$BACKEND_IMAGE' '$FRONTEND_IMAGE' '${{ github.actor }}'"
