[project]
name = "cashflow-backend"
version = "0.1.0"
description = "CashFlow HTTP API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "flask>=3.1,<4",
  "flask-cors>=6,<7",
  "flask-sqlalchemy>=3.1,<4",
  "gunicorn>=23,<24",
  "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.16,<1",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
exclude = ["alice.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E712"]
