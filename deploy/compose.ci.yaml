name: cashflow-ci

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: cashflow_dev
      POSTGRES_USER: cashflow
      POSTGRES_PASSWORD: cashflow-ci-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashflow -d cashflow_dev"]
      interval: 2s
      timeout: 2s
      retries: 30

  backend:
    build:
      context: ../backend
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      CASHFLOW_ENVIRONMENT: production
      CASHFLOW_DATABASE_URL: postgresql+psycopg://cashflow:cashflow-ci-only@postgres/cashflow_dev
      CASHFLOW_TRUSTED_HOSTS: localhost,127.0.0.1,backend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ../app
      dockerfile: Dockerfile.web
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    image: caddy:2.10-alpine
    ports:
      - 127.0.0.1:18081:8080
    volumes:
      - ./Caddyfile.ci:/etc/caddy/Caddyfile:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
